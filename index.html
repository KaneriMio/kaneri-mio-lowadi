<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lowadi | Kaneri Mio Company</title>
  <style>
    :root {
      --bg-color: #f7ede2;
      --header-bg: #4a2810;
      --btn-active: #84522b;
      --btn-inactive: #eee4dc;
      --text-main: #2b2d42;
      --card-bg: #ffffff;
      --tag-black-market: #a3704c;
      --tag-currency: #5bc0be;
      --tag-colors: #cfa846;
      --tag-services: #8338ec;
      --tag-companions: #ff007f;
      --tag-trophies: #ffb703;
      --tag-announcements: #02c39a;
      --tag-other: #6c757d;
      --section-bg: #fdfaf7;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    header {
      background-color: var(--header-bg);
      color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      font-weight: bold;
      font-size: 18px;
    }

    .header-server-selector { position: relative; display: inline-block; }
    .server-current-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .server-dropdown-content { display: none; position: absolute; top: 100%; left: 0; background-color: #fff; min-width: 130px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 6px; z-index: 100; margin-top: 5px; overflow: hidden; }
    .server-dropdown-content a { color: #333; padding: 10px 12px; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .server-dropdown-content a:hover { background-color: #f1f1f1; }
    .header-server-selector:hover .server-dropdown-content { display: block; }

    header .brand-title { position: absolute; left: 50%; transform: translateX(-50%); }
    .header-controls { display: flex; align-items: center; gap: 20px; }

    .wiki-dropdown { position: relative; display: inline-block; }
    .wiki-btn-text { color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 4px; padding: 5px 0; }
    .wiki-dropdown-content { display: none; position: absolute; top: 100%; right: 0; background-color: #fff; min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border-radius: 6px; z-index: 100; margin-top: 5px; overflow: hidden; }
    .wiki-dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; font-size: 14px; font-weight: 500; border-bottom: 1px solid #f5f5f5; }
    .wiki-dropdown-content a:last-child { border-bottom: none; }
    .wiki-dropdown-content a:hover { background-color: var(--btn-inactive); color: var(--header-bg); }
    .wiki-dropdown:hover .wiki-dropdown-content { display: block; }

    .header-icon-btn { background: none; border: none; cursor: pointer; position: relative; display: flex; align-items: center; padding: 0; }
    .header-icon-btn svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; transition: transform 0.2s; }
    .header-icon-btn:hover svg { transform: scale(1.1); }
    .header-icon-btn.fav-page-active svg { fill: #d32f2f; stroke: #d32f2f; }

    .cart-badge, .fav-badge { position: absolute; top: -5px; right: -8px; background: #d32f2f; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    .fav-badge { background: #84522b; }

    .container { max-width: 1200px; margin: 0 auto; padding: 30px 15px; }

    .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 30px; margin-bottom: 10px; }
    .page-btn { background-color: #fff; color: #4a2810; border: 1px solid #ddd; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s; }
    .page-btn.active { background-color: var(--btn-active); color: #fff; border-color: var(--btn-active); }
    .page-btn:disabled { background-color: #eee; color: #aaa; cursor: not-allowed; border-color: #ddd; }

    .search-panel { background: #fff; padding: 12px 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
    .search-input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid #eee; border-radius: 6px; font-size: 14px; outline: none; }
    .search-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .search-select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; background-color: #fff; font-size: 13px; outline: none; color: #4a2a16; cursor: pointer; }

    .filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .filter-btn { background-color: var(--btn-inactive); color: #4a2416; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap; }
    .filter-btn.active { background-color: var(--btn-active); color: #fff; }

    .sub-filters { display: none; gap: 10px; margin-bottom: 30px; padding-left: 10px; border-left: 3px solid var(--btn-active); }
    .sub-filter-btn { background-color: #ffffff; color: #84522b; border: 1px solid #84522b; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .sub-filter-btn.active { background-color: #84522b; color: #ffffff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.02); cursor: pointer; position: relative; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .card::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%); transform: skewX(-25deg); transition: none; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(74, 40, 16, 0.15); }
    .card:hover::after { left: 150%; transition: left 0.6s ease-in-out; }

    .image-wrapper { height: 180px; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }
    .card img { max-height: 100%; max-width: 100%; object-fit: contain; transition: transform 0.3s ease; }
    .card:hover img { transform: scale(1.08); }

    .card-fav-btn { position: absolute; top: 12px; left: 12px; background: rgba(255, 255, 255, 0.9); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,0.1); transition: transform 0.2s, background 0.2s; }
    .card-fav-btn:hover { transform: scale(1.1); background: #fff; }
    .card-fav-btn svg { width: 16px; height: 16px; fill: none; stroke: #8d99ae; stroke-width: 2; transition: fill 0.2s, stroke 0.2s; }
    .card-fav-btn.active svg { fill: #d32f2f; stroke: #d32f2f; }

    .badge { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 20px; color: #fff; text-transform: uppercase; z-index: 2; }
    .badge.new { background-color: #2e7d32; }
    .badge.hot { background-color: #d32f2f; }
    .badge.limited { background-color: #f57c00; }

    .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; border-top: 1px solid #f0f0f0; text-align: left; }
    .tag { align-self: flex-start; font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; color: #fff; margin-bottom: 12px; }
    
    .tag.черный-рынок { background-color: var(--tag-black-market); }
    .tag.валюта { background-color: var(--tag-currency); }
    .tag.окрасы { background-color: var(--tag-colors); }
    .tag.услуги { background-color: var(--tag-services); }
    .tag.спутники { background-color: var(--tag-companions); }
    .tag.трофеи { background-color: var(--tag-trophies); }
    .tag.объявления { background-color: var(--tag-announcements); }
    .tag.другое { background-color: var(--tag-other); }
    .card-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; color: #222; }
    .card-meta-text { font-size: 13px; color: #4a2810; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .card-meta-text span { font-weight: 500; color: #555; }
    .card-description { font-size: 13.5px; color: #333; font-weight: 550; line-height: 1.5; margin: 8px 0 20px 0; flex-grow: 1; text-align: justify; }

    .card-footer { border-top: 1px solid #f5f5f5; padding-top: 12px; font-size: 12px; color: #8d99ae; margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .card-footer strong { color: #333; font-weight: bold; }
    .out-of-stock { color: #d32f2f !important; }
    .out-of-stock strong { color: #d32f2f !important; }

    .cart-btn { background: #2e7d32; border: none; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
    .cart-btn:hover { background: #215d25; }
    .cart-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; }

    .card-qty-controls { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #ddd; padding: 3px 6px; border-radius: 8px; height: 36px; }
    .card-qty-btn { background: #f5f5f5; border: 1px solid #e0e0e0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; color: #333; }
    .card-qty-btn:hover { background: #e0e0e0; }
    .card-qty-value { font-size: 13px; font-weight: bold; min-width: 14px; text-align: center; color: #333; }

    .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .drawer-overlay.active { opacity: 1; visibility: visible; }

    .drawer { position: fixed; top: 0; right: -460px; width: 100%; max-width: 450px; height: 100%; background: #fff; z-index: 1001; box-shadow: -5px 0 25px rgba(0,0,0,0.15); transition: right 0.3s ease-in-out; display: flex; flex-direction: column; padding: 24px; overflow-y: auto; }
    .drawer.active { right: 0 !important; }
    .drawer-close { align-self: flex-end; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
    .drawer-image-wrapper { display: flex; justify-content: center; margin-bottom: 20px; }
    .drawer-image-wrapper img { max-height: 150px; object-fit: contain; }
    .drawer-title { font-size: 24px; font-weight: bold; margin: 0 0 12px 0; color: #3b2314; }

    .section-label { font-size: 11px; font-weight: bold; color: #a38570; text-transform: uppercase; margin: 20px 0 8px 0; letter-spacing: 0.5px; }
    .info-box { background-color: var(--section-bg); border-radius: 8px; padding: 16px; font-size: 14px; line-height: 1.5; color: #4a4a4a; border-left: 4px solid #ebdcd0; }
    .note-box { background-color: #fff3e0; border-left: 4px solid #ffb74d; color: #b78103; font-weight: 500; }
    .admin-icons-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
    .admin-mini-icon { width: 36px; height: 36px; object-fit: contain; background: transparent; padding: 0; border: none; }
    .companion-img { width: 42px; height: 42px; object-fit: contain; background: transparent; vertical-align: middle; margin-left: 5px; }

    .server-flags-list { display: flex; gap: 8px; font-size: 20px; background: var(--section-bg); padding: 12px; border-radius: 8px; }

    .option-select-block { background: var(--section-bg); padding: 12px; border-radius: 8px; border: 1px dashed #ddd; margin-bottom: 10px; }
    .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 500; }
    .option-row:last-child { margin-bottom: 0; }
    .option-select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 12px; outline: none; max-width: 180px; }

    .drawer-row { display: flex; gap: 15px; margin-top: 20px; }
    .drawer-col { flex: 1; }
    .status-box { background: var(--section-bg); padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; color: #614635; text-align: center; }
    .price-box { background: #e8f5e9; border: 1px solid #c8e6c9; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; color: #2e7d32; text-align: center; }
    .drawer-buy-btn { background-color: #2e7d32; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
    .drawer-buy-btn:hover { background-color: #215d25; }
    .drawer-buy-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; }

    .cart-items-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
    .cart-item { display: flex; gap: 12px; background: var(--section-bg); padding: 12px; border-radius: 8px; position: relative; border: 1px solid #eee; }
    .cart-item img { width: 60px; height: 60px; object-fit: contain; }
    .cart-item-details { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
    .cart-item-name { font-weight: bold; font-size: 14px; }
    .cart-item-meta { font-size: 12px; color: #666; line-height: 1.4; }
    .cart-item-price { font-weight: bold; color: #2e7d32; font-size: 13px; }
    
    .quantity-controls { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .qty-btn { background: #fff; border: 1px solid #ddd; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .remove-item-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #d32f2f; font-size: 16px; cursor: pointer; }

    .cart-footer-actions { border-top: 1px solid #eee; padding-top: 15px; display: flex; gap: 10px; align-items: center; }
    .buy-btn { flex-grow: 1; background-color: #2e7d32; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .clear-cart-btn { background-color: #d32f2f; width: 48px; height: 48px; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .clear-cart-btn svg { width: 22px; height: 22px; }

    .toast { position: fixed; top: 20px; right: 20px; background: #2e7d32; color: #fff; border-left: 5px solid rgba(255, 255, 255, 0.6); padding: 14px 20px; border-radius: 8px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(46,125,50,0.3); z-index: 2000; transform: translateY(-100px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-close { background: none; border: none; color: rgba(255,255,255,0.8); font-size: 18px; cursor: pointer; padding: 0; margin-left: auto; }

    .popup-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: #fff; width: 90%; max-width: 420px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 3000; text-align: center; display: none; transition: transform 0.2s; }
    .popup-modal.active { display: block; transform: translate(-50%, -50%) scale(1); }
    .popup-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #4a2810; }
    .popup-text { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 20px; }
    .popup-actions { display: flex; gap: 12px; justify-content: center; }
    .popup-btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .popup-btn-catalog { background-color: #2e7d32; color: #fff; }
    .popup-btn-close { background-color: #eee; color: #333; }
    
    .server-modal-select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; font-size: 15px; outline: none; margin-bottom: 20px; }
        /* Новая компактная сетка в 2 столбца для блока характеристик масти */
    .meta-two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 15px;
    }
    .meta-item-full {
      grid-column: 1 / -1;
    }

    /* Стили для кнопки очистки Избранного в режиме виртуальной страницы */
    .clear-fav-container {
      grid-column: 1 / -1;
      text-align: right;
      margin-bottom: 15px;
    }
    .clear-fav-btn {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background 0.2s;
    }
    .clear-fav-btn:hover {
      background-color: #b71c1c;
    }

    /* Корректировка отображения цены и кнопок в футере карточки */
    .card-footer-price {
      font-size: 17px;
      font-weight: bold;
      color: #2e7d32;
    }
    .card-meta-stock-line {
      font-size: 13px;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
    }
    /* Стили для формы ввода Ника внутри модального окна опта */
    .nick-input-field {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--btn-active);
      border-radius: 6px;
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 15px;
      outline: none;
      font-weight: bold;
      text-align: center;
    }
    .nick-input-field:focus {
      box-shadow: 0 0 8px rgba(132, 82, 43, 0.4);
    }
    /* Стилизация строк калькулятора сделки в корзине */
    .cart-currency-calc {
      background-color: #fff3e0;
      border-left: 3px solid #ffb74d;
      padding: 8px 10px;
      border-radius: 4px;
      margin-top: 6px;
      font-size: 12px;
      color: #b78103;
      line-height: 1.4;
    }
    .cart-currency-calc strong {
      color: #4a2810;
    }

<body>

<header>
  <div class="header-server-selector">
    <button class="server-current-btn" id="currentServerBtn">🇷🇺 RU</button>
    <div class="server-dropdown-content">
      <a href="#" onclick="changeGlobalServer('🇷🇺'); return false;">🇷🇺 RU</a>
      <a href="#" onclick="changeGlobalServer('🇺🇳'); return false;">🇺🇳 UN</a>
      <a href="#" onclick="changeGlobalServer('🇪🇦'); return false;">🇪🇦 ES</a>
      <a href="#" onclick="changeGlobalServer('🇫🇷'); return false;">🇫🇷 FR</a>
    </div>
  </div>

  <span class="brand-title">🐴 Lowadi | Kaneri Mio Company</span>

  <div class="header-controls">
    <div class="wiki-dropdown">
      <span class="wiki-btn-text">Вики ▼</span>
      <div class="wiki-dropdown-content">
        <a href="./wiki-breeds.html">Породы</a>
        <a href="./wiki-competitions.html">Схемы соревнований</a>
        <a href="./wiki-gods.html">Боги</a>
        <a href="./wiki-faq.html">Часто задаваемые вопросы</a>
      </div>
    </div>

    <button class="header-icon-btn" id="openFavBtn">
      ❤️ <div class="fav-badge" id="favBadge">0</div>
    </button>

    <button class="header-icon-btn" id="openCartBtn">
      🛒 <div class="cart-badge" id="cartBadge">0</div>
    </button>
  </div>
</header>

<div class="container">

  <div class="search-panel">
    <input type="text" id="search" class="search-input" placeholder="Поиск...">

    <div class="search-filters">
      <select id="stockFilter">
        <option value="all">Все</option>
        <option value="available">В наличии</option>
      </select>

      <select id="tagFilter">
        <option value="all">Все метки</option>
        <option value="new">NEW</option>
        <option value="limited">Limited</option>
        <option value="hot">Hot</option>
      </select>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-category="all">Все</button>
    <button class="filter-btn" data-category="Черный рынок">Черный рынок</button>
    <button class="filter-btn" data-category="Валюта">Валюта</button>
    <button class="filter-btn" data-category="Окрасы">Окрасы</button>
    <button class="filter-btn" data-category="Спутники">Спутники</button>
    <button class="filter-btn" data-category="Трофеи">Трофеи</button>
    <button class="filter-btn" data-category="Объявления">Объявления</button>
    <button class="filter-btn" data-category="Услуги">Услуги</button>
    <button class="filter-btn" data-category="Другое">Другое</button>
  </div>

  <div class="sub-filters" id="subFiltersContainer">
    <button class="sub-filter-btn active" data-subcategory="all">Все окрасы</button>
    <button class="sub-filter-btn" data-subcategory="ЗЯ">ЗЯ</button>
    <button class="sub-filter-btn" data-subcategory="ИЗЯ">ИЗЯ</button>
  </div>

  <div id="products" class="grid"></div>
  <div id="pagination"></div>
</div>

<div id="overlay" class="drawer-overlay"></div>

<!-- DRAWERS -->
<div id="drawer" class="drawer">
  <button id="closeDrawer">&times;</button>

  <img id="d-image">
  <h2 id="d-name"></h2>
  <div id="d-tag"></div>

  <div id="d-meta-container"></div>
  <div id="d-options-container"></div>

  <div id="d-description"></div>
  <div id="d-get"></div>

  <div id="d-flags"></div>

  <div>
    <span id="d-count"></span>
    <span id="d-price"></span>
  </div>

  <button id="drawerAddCartBtn">В корзину</button>
</div>

<div id="cartDrawer" class="drawer">
  <button id="closeCartDrawer">&times;</button>

  <div id="cartItemsContainer"></div>
  <div id="cartTotalPrice"></div>

  <button id="checkoutBtn">Оформить</button>
  <button id="clearCartBtn">Очистить</button>
</div>

<!-- MODALS -->
<div id="appleModal" class="popup-modal">
  <div class="popup-title">Внимание!</div>
  <div class="popup-text" id="appleModalText"></div>
  <button id="modalCloseBtn">Закрыть</button>
  <button id="modalGoCatalogBtn">В каталог</button>
</div>

<div id="confirmClearCartModal" class="popup-modal">
  <div class="popup-title">Очистить корзину?</div>
  <button id="cancelClearCartBtn">Отмена</button>
  <button id="confirmClearCartBtn">Да</button>
</div>

<div id="serverWelcomeModal" class="popup-modal">
  <div class="popup-title" id="serverModalTitle">Добро пожаловать</div>
  <div id="serverModalText"></div>

  <select id="welcomeServerSelect">
    <option value="🇷🇺">RU</option>
    <option value="🇺🇳">UN</option>
    <option value="🇪🇦">ES</option>
    <option value="🇫🇷">FR</option>
  </select>

  <button id="submitServerBtn">OK</button>
</div>

<div id="currencyTeamModal" class="popup-modal">
  <div class="popup-title">Командный заказ</div>

  <input id="playerGameNick" placeholder="Ник">

  <button id="cancelTeamOrderBtn">Отмена</button>
  <button id="confirmTeamOrderBtn">Продолжить</button>
</div>

<!-- TOAST -->
<div id="cartToast" class="toast">
  <span id="toastMessage"></span>
  <button id="closeToastBtn">&times;</button>
</div>

<!-- МОДАЛ ВЫБОРА ТАРИФА ВАЛЮТЫ -->
<div id="currencyConfirmModal" class="modal">
  <div class="modal-content">
    <p>Выбор тарифа валюты</p>

    <button onclick="confirmCurrency('normal')">Обычный</button>
    <button onclick="confirmCurrency('urgent')">Срочный</button>

    <button onclick="cancelCurrency()">Отмена</button>
  </div>
</div>

<!-- SCRIPTS -->
<script src="./state.js"></script>
<script src="./ui-drawers.js"></script>
<script src="./currency.js"></script>
<script src="./cart.js"></script>

</body>
</html>
