<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Kaneri Mio Company</title>
    <!-- Подключаем админку через альтернативный, самый быстрый и независимый сервер CDN -->
    <script src="https://unpkg.com@^3.1.0/dist/decap-cms.js"></script>
    
    </script>
</head>
<body>
    <script>
        // Этот скрипт поймает успешный вход через Netlify Identity и пустит вас в систему
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "./";
                    });
                }
            });
        }
    </script>
</body>
</html>
