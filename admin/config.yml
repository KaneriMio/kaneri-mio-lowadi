backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: coats
    label: Окрасы Lowadi
    label_singular: Окрас
    file: database.json
    format: json
    fields:
      - { label: "ID масти", name: id, widget: string }
      - { label: "Название масти", name: name, widget: string }
      - { label: "Никнейм Автора", name: author, widget: string }
      - { label: "Вид лошади", name: type, widget: select, options: ["верховая", "пегас", "единорог", "пони", "осел"] }
      - { label: "Копии (для ИЗЯ)", name: copies, widget: string, required: false }
      - { label: "Цена", name: price, widget: string }
      - { label: "В наличии", name: count, widget: string }
      - { label: "Картинка", name: image, widget: image }
      - { label: "Статус", name: status, widget: select, options: ["none", "new", "limited"], default: "none" }
      - { label: "Темы", name: tags, widget: list }
      - { label: "Просмотры", name: views, widget: number, value_type: int, default: 0 }
      - { label: "Каталог", name: category, widget: select, options: [{label: "ЗЯ", value: "zy"}, {label: "ИЗЯ", value: "izzy"}] }
      - label: Доступные сервера
        name: servers
        widget: list
        field: { name: server, widget: select, options: ["РУ (Русский)", "ИНТ (Интернациональный)", "ИСП (Испанский)", "ФРА (Французский)"] }

  - name: items
    label: Предметы на главной
    label_singular: Предмет
    file: items.json
    format: json
    fields:
      - { label: "ID предмета", name: id, widget: string }
      - { label: "Название предмета", name: name, widget: string }
      - { label: "Категория", name: category, widget: select, options: [{label: "Черный рынок", value: "black_market"}, {label: "ЗЯ", value: "zy"}, {label: "ИЗЯ", value: "izzy"}] }
      - { label: "Описание", name: description, widget: text }
      - { label: "Цена предмета", name: price, widget: string }
      - { label: "В наличии", name: count, widget: string }
      - { label: "Картинка", name: image, widget: image }
      - label: Доступные сервера
        name: servers
        widget: list
        field: { name: server, widget: select, options: ["РУ (Русский)", "ИНТ (Интернациональный)", "ИСП (Испанский)", "ФРА (Французский)"] }
